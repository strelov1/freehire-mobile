name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Expo's dev server writes this ambient-types file (referencing
      # expo/types, which declares *.css/*.module.css imports among other
      # things) on first boot; it's gitignored, and a plain `npm ci` in CI
      # never boots the server, so tsc silently drops those declarations
      # without it. Static content — Expo's own template for the file.
      - name: Generate expo-env.d.ts
        run: |
          cat > expo-env.d.ts <<'EOF'
          /// <reference types="expo/types" />

          // NOTE: This file should not be edited and should be in your git ignore
          EOF

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test
