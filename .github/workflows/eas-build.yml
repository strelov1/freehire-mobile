name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [ios, android, all]
        required: true
      profile:
        description: EAS build profile
        type: choice
        options: [development, preview, production]
        required: true
      distribute-android:
        description: >-
          Distribute the Android build to Firebase App Distribution once it
          finishes (blocks the job until the build completes, instead of the
          usual fire-and-forget dispatch). No-op when platform is "ios".
        type: boolean
        default: false
      testers-group:
        description: >-
          Firebase App Distribution tester group to notify. Must already
          exist in the Firebase console (App Distribution → Testers &
          Groups) — this workflow doesn't create it.
        type: string
        default: testers
      submit-android:
        description: >-
          Submit the Android build to Google Play once it finishes (blocks the
          job until the build completes). Needs the `production` profile, since
          Play takes an .aab. Requires a Google Play service account already
          stored on EAS via `eas credentials -p android`, and the first upload
          of this package name to have been made by hand — Google refuses the
          first one over the API. No-op when platform is "ios".
        type: boolean
        default: false
      submit-ios:
        description: >-
          Submit the iOS build to App Store Connect / TestFlight once it
          finishes (blocks the job until the build completes). Requires an
          App Store Connect API Key already configured via `eas credentials
          -p ios` (see eas.json's submit.production.ios) — this workflow
          can't set that up. No-op when platform is "android".
        type: boolean
        default: false
      testflight-group:
        description: >-
          Internal TestFlight group to add the build to. Leave empty to
          submit without assigning a group (assign manually in App Store
          Connect afterward).
        type: string
        default: ""

  # The same build, callable from another workflow — `release.yml` invokes it
  # once per platform, because a release needs two different profiles at once
  # (production for the App Store, preview for Firebase, which only takes an
  # APK). The inputs have to be declared again rather than shared: GitHub keeps
  # `workflow_dispatch` and `workflow_call` input lists separate. `choice` has
  # no `workflow_call` equivalent, hence `string` for the two enums.
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      profile:
        type: string
        required: true
      distribute-android:
        type: boolean
        default: false
      testers-group:
        type: string
        default: testers
      submit-android:
        type: boolean
        default: false
      submit-ios:
        type: boolean
        default: false
      testflight-group:
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Fail in seconds on a combination that cannot work, rather than after a
      # ~20 minute build: the production profile emits an .aab for Google Play,
      # and Firebase App Distribution rejects it ("APK cannot be analyzed using
      # aapt dump badging") unless the app is linked to a Play account. The APK
      # comes from the internal-distribution profiles.
      - name: Reject a Firebase distribution of a Play bundle
        if: ${{ inputs.distribute-android && inputs.profile == 'production' && inputs.platform != 'ios' }}
        run: |
          echo "::error::Firebase App Distribution needs an APK; the 'production' profile builds an .aab. Use the 'preview' profile for Android distribution." >&2
          exit 1

      # The mirror image of the guard above, and for the same reason: Play takes
      # an .aab and only the production profile emits one. Caught here rather
      # than after a ~20 minute build, where the message would be about a file
      # extension rather than about the profile that chose it.
      - name: Reject a Play submission of an APK
        if: ${{ inputs.submit-android && inputs.profile != 'production' && inputs.platform != 'ios' }}
        run: |
          echo "::error::Google Play needs an .aab; only the 'production' profile builds one. The 'preview' profile is for Firebase." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Requires the EXPO_TOKEN repo secret (Expo access token) for
      # non-interactive eas-cli auth. Production Android builds additionally
      # require the release keystore to already be uploaded to EAS via
      # `eas credentials` (eas.json points production Android at remote,
      # EAS-managed credentials rather than a local keystore file).
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Firebase distribution / TestFlight submission both need the finished
      # build's artifact (URL for Firebase, build ID for `eas submit`), so
      # the dispatch can't stay fire-and-forget (--no-wait) when either was
      # requested — only then do we wait and emit --json. The plain dispatch
      # path (both flags false, the default) is unchanged.
      #
      # Waiting is spelled `--wait`, not `--no-wait=false`: eas-cli declares the
      # pair as `--[no-]wait`, an oclif boolean, so the negated form takes no
      # value and `=false` is parsed as a stray positional — `Unexpected
      # argument: false`, exit 1, two seconds in, before any build starts. That
      # is why neither the Firebase nor the TestFlight path had ever run.
      - name: Build
        env:
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
          DISTRIBUTE_ANDROID: ${{ inputs.distribute-android }}
          SUBMIT_ANDROID: ${{ inputs.submit-android }}
          SUBMIT_IOS: ${{ inputs.submit-ios }}
        run: |
          if [ "$DISTRIBUTE_ANDROID" = "true" ] || [ "$SUBMIT_ANDROID" = "true" ] || [ "$SUBMIT_IOS" = "true" ]; then
            eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --json --wait > build-output.json
          else
            eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait
          fi

      # Firebase project: freehire-mobile (created for this app specifically;
      # Android app me.freehire.mobile). Auth is a CI-only service account
      # (firebase-appdistribution-ci@freehire-mobile.iam.gserviceaccount.com,
      # role roles/firebaseappdistro.admin) stored as the
      # FIREBASE_SERVICE_ACCOUNT_JSON repo secret. Manually verified end to
      # end (service account auth, tester add, APK upload + distribute) with
      # an existing EAS build artifact before wiring this into CI — the jq
      # filter below matches the real `eas build --json` shape (an array of
      # build objects with `.platform` and `.artifacts.buildUrl`).
      - name: Distribute Android build to Firebase App Distribution
        if: ${{ inputs.distribute-android && (inputs.platform == 'android' || inputs.platform == 'all') }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: "1:752171182958:android:fa4495f4e8a547bef26f7f"
          TESTERS_GROUP: ${{ inputs.testers-group }}
          PROFILE: ${{ inputs.profile }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json

          BUILD_URL=$(jq -r '[.[] | select(.platform == "ANDROID")][0].artifacts.buildUrl // empty' build-output.json)
          if [ -z "$BUILD_URL" ]; then
            echo "::error::No Android build artifact URL found in build-output.json" >&2
            cat build-output.json >&2
            exit 1
          fi

          curl -sL -o app-release.apk "$BUILD_URL"
          npx --yes firebase-tools appdistribution:distribute app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTERS_GROUP" \
            --release-notes "EAS $PROFILE build — $GITHUB_SHA"

          rm -f /tmp/firebase-sa.json

      # The track lives in eas.json's submit.production.android, not here: it is
      # a property of the release, and putting it in a workflow input would let
      # a stray dispatch push to `production` from a dropdown. Changing track is
      # an edit to that file, reviewed like any other.
      #
      # The Google Play service account JSON must already be on EAS
      # (`eas credentials -p android`), the same arrangement as the App Store
      # Connect key below and the Android keystore — nothing secret is held by
      # this repo, so EXPO_TOKEN is the only secret the step needs. Google also
      # refuses the FIRST upload of a package name over the API, so one .aab has
      # to be uploaded by hand in the Play Console before this can ever pass.
      - name: Submit Android build to Google Play
        if: ${{ inputs.submit-android && (inputs.platform == 'android' || inputs.platform == 'all') }}
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          BUILD_ID=$(jq -r '[.[] | select(.platform == "ANDROID")][0].id // empty' build-output.json)
          if [ -z "$BUILD_ID" ]; then
            echo "::error::No Android build id found in build-output.json" >&2
            cat build-output.json >&2
            exit 1
          fi

          eas submit --platform android --profile "$PROFILE" --id "$BUILD_ID" --non-interactive

      # eas.json's submit.production.ios has the Apple Team ID; the App Store
      # Connect API Key itself must already be stored on EAS via
      # `eas credentials -p ios` (run locally, interactively, once — it can't
      # be scripted from CI since it needs the key generated in App Store
      # Connect). Once that's done, EXPO_TOKEN alone is enough here, same as
      # how production Android's keystore is already EAS-remote-managed.
      - name: Submit iOS build to TestFlight
        if: ${{ inputs.submit-ios && (inputs.platform == 'ios' || inputs.platform == 'all') }}
        env:
          PROFILE: ${{ inputs.profile }}
          TESTFLIGHT_GROUP: ${{ inputs.testflight-group }}
        run: |
          BUILD_ID=$(jq -r '[.[] | select(.platform == "IOS")][0].id // empty' build-output.json)
          if [ -z "$BUILD_ID" ]; then
            echo "::error::No iOS build id found in build-output.json" >&2
            cat build-output.json >&2
            exit 1
          fi

          if [ -n "$TESTFLIGHT_GROUP" ]; then
            eas submit --platform ios --profile "$PROFILE" --id "$BUILD_ID" --groups "$TESTFLIGHT_GROUP" --non-interactive
          else
            eas submit --platform ios --profile "$PROFILE" --id "$BUILD_ID" --non-interactive
          fi
