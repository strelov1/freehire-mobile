name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [ios, android, all]
        required: true
      profile:
        description: EAS build profile
        type: choice
        options: [development, preview, production]
        required: true
      distribute-android:
        description: >-
          Distribute the Android build to Firebase App Distribution once it
          finishes (blocks the job until the build completes, instead of the
          usual fire-and-forget dispatch). No-op when platform is "ios".
        type: boolean
        default: false
      testers-group:
        description: >-
          Firebase App Distribution tester group to notify. Must already
          exist in the Firebase console (App Distribution → Testers &
          Groups) — this workflow doesn't create it.
        type: string
        default: testers
      submit-ios:
        description: >-
          Submit the iOS build to App Store Connect / TestFlight once it
          finishes (blocks the job until the build completes). Requires an
          App Store Connect API Key already configured via `eas credentials
          -p ios` (see eas.json's submit.production.ios) — this workflow
          can't set that up. No-op when platform is "android".
        type: boolean
        default: false
      testflight-group:
        description: >-
          Internal TestFlight group to add the build to. Leave empty to
          submit without assigning a group (assign manually in App Store
          Connect afterward).
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Requires the EXPO_TOKEN repo secret (Expo access token) for
      # non-interactive eas-cli auth. Production Android builds additionally
      # require the release keystore to already be uploaded to EAS via
      # `eas credentials` (eas.json points production Android at remote,
      # EAS-managed credentials rather than a local keystore file).
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Firebase distribution / TestFlight submission both need the finished
      # build's artifact (URL for Firebase, build ID for `eas submit`), so
      # the dispatch can't stay fire-and-forget (--no-wait) when either was
      # requested — only then do we wait and emit --json. The plain dispatch
      # path (both flags false, the default) is unchanged.
      - name: Build
        env:
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
          DISTRIBUTE_ANDROID: ${{ inputs.distribute-android }}
          SUBMIT_IOS: ${{ inputs.submit-ios }}
        run: |
          if [ "$DISTRIBUTE_ANDROID" = "true" ] || [ "$SUBMIT_IOS" = "true" ]; then
            eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --json --no-wait=false > build-output.json
          else
            eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait
          fi

      # Firebase project: freehire-mobile (created for this app specifically;
      # Android app me.freehire.mobile). Auth is a CI-only service account
      # (firebase-appdistribution-ci@freehire-mobile.iam.gserviceaccount.com,
      # role roles/firebaseappdistro.admin) stored as the
      # FIREBASE_SERVICE_ACCOUNT_JSON repo secret. Manually verified end to
      # end (service account auth, tester add, APK upload + distribute) with
      # an existing EAS build artifact before wiring this into CI — the jq
      # filter below matches the real `eas build --json` shape (an array of
      # build objects with `.platform` and `.artifacts.buildUrl`).
      - name: Distribute Android build to Firebase App Distribution
        if: ${{ inputs.distribute-android && (inputs.platform == 'android' || inputs.platform == 'all') }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: "1:752171182958:android:fa4495f4e8a547bef26f7f"
          TESTERS_GROUP: ${{ inputs.testers-group }}
          PROFILE: ${{ inputs.profile }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json

          BUILD_URL=$(jq -r '[.[] | select(.platform == "ANDROID")][0].artifacts.buildUrl // empty' build-output.json)
          if [ -z "$BUILD_URL" ]; then
            echo "::error::No Android build artifact URL found in build-output.json" >&2
            cat build-output.json >&2
            exit 1
          fi

          curl -sL -o app-release.apk "$BUILD_URL"
          npx --yes firebase-tools appdistribution:distribute app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTERS_GROUP" \
            --release-notes "EAS $PROFILE build — $GITHUB_SHA"

          rm -f /tmp/firebase-sa.json

      # eas.json's submit.production.ios has the Apple Team ID; the App Store
      # Connect API Key itself must already be stored on EAS via
      # `eas credentials -p ios` (run locally, interactively, once — it can't
      # be scripted from CI since it needs the key generated in App Store
      # Connect). Once that's done, EXPO_TOKEN alone is enough here, same as
      # how production Android's keystore is already EAS-remote-managed.
      - name: Submit iOS build to TestFlight
        if: ${{ inputs.submit-ios && (inputs.platform == 'ios' || inputs.platform == 'all') }}
        env:
          PROFILE: ${{ inputs.profile }}
          TESTFLIGHT_GROUP: ${{ inputs.testflight-group }}
        run: |
          BUILD_ID=$(jq -r '[.[] | select(.platform == "IOS")][0].id // empty' build-output.json)
          if [ -z "$BUILD_ID" ]; then
            echo "::error::No iOS build id found in build-output.json" >&2
            cat build-output.json >&2
            exit 1
          fi

          if [ -n "$TESTFLIGHT_GROUP" ]; then
            eas submit --platform ios --profile "$PROFILE" --id "$BUILD_ID" --groups "$TESTFLIGHT_GROUP" --non-interactive
          else
            eas submit --platform ios --profile "$PROFILE" --id "$BUILD_ID" --non-interactive
          fi
